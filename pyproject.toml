[project]
name = "rag-authz"
version = "0.1.0.dev0"
description = "Sync source ACLs into OpenFGA or SpiceDB and enforce them inside vector search, with deletions that actually propagate."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Muhammad Amar Sohail" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
# Library-style ranges: the SDK and retrievers install into users' applications, so exact pins
# would cause resolver conflicts. uv.lock (with hashes) pins every environment we run: dev, CI,
# benchmark and the sidecar image. See docs/adr/0001-stack.md.
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.9,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
pgvector = [
    "pgvector>=0.4,<0.6",
    "psycopg>=3.2,<4",
]
langchain = [
    "langchain-core>=1.0,<2",
]
bench = [
    "numpy>=2.2,<3",
]
spicedb = [
    "authzed>=1.20,<2",
]
server = [
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.30,<2",
    "uvicorn>=0.32,<1",
]
llamaindex = [
    "llama-index-core>=0.14,<0.15",
]

[project.scripts]
rag-authz = "rag_authz.cli:app"

[dependency-groups]
# Only the sidecar image installs this: a self-contained libpq, so the image needs no system
# packages. Library users choose psycopg's binary or system-libpq build themselves.
image = [
    "psycopg[binary]==3.3.6",
]
dev = [
    "hypothesis==6.168.1",
    "mypy==2.3.1",
    "psycopg[binary]==3.3.6",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_authz"]

[tool.uv]
# Supply-chain guard: ignore anything published after this date when resolving.
exclude-newer = "2026-09-26T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag_authz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs the Docker Compose services (make up)",
]

[[tool.mypy.overrides]]
# grpcio and authzed's grpcutil ship no type information.
module = ["grpc", "grpc.*", "grpcutil", "grpcutil.*"]
ignore_missing_imports = true
